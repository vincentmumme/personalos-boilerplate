name: system-service
page_shape: state-record
canonical_owner: system-service-registry
allowed_roots: [system]
path_pattern: ^system/services/[a-z0-9]+(?:-[a-z0-9]+)*\.md$
required_modules: [lifecycle, authority]
optional_modules: []
required_fields: [lifecycle, canonical_system_ref, authority_scope, service_kind, execution_target_refs, desired_state]
optional_fields: [service_integration_ref]
fields:
  service_kind:
    datatype: enum
    enum: [launch-agent, daemon, scheduled-job, local-api, sync-service]
  execution_target_refs:
    datatype: wikilink-list
    min_items: 1
    target_profiles: [runtime, host]
    legacy_targets: reject
  desired_state:
    datatype: enum
    enum: [running, stopped, manual]
  service_integration_ref:
    datatype: wikilink
    target_profiles: [integration]
    legacy_targets: reject
module_constraints:
  lifecycle:
    enum: [planned, active, paused, retired]
required_sections: [Current Truth, Purpose, Desired State, Execution Target, Trigger and Dependencies, Health, Timeline]
section_order: [Current Truth, Purpose, Desired State, Execution Target, Trigger and Dependencies, Health, Timeline]
template: system/templates/topology/system-service.md
admission:
  positive_fixture: system/data-model/tests/fixtures/valid-system-service.fixture
  positive_logical_path: system/services/example-service.md
  negative_fixture: system/data-model/tests/fixtures/invalid-system-service.fixture
  negative_logical_path: system/services/example-service.md
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: system/data-model/legacy-mapping.md
