name: customer-profile
page_shape: state-record
canonical_owner: business-customer-profile
allowed_roots: [business]
path_pattern: ^business/customer-profiles/[a-z0-9]+(?:-[a-z0-9]+)*\.md$
required_modules: [lifecycle, authority, business-context]
optional_modules: []
required_fields: [lifecycle, canonical_system_ref, authority_scope]
optional_fields: [company_refs, brand_refs, market_refs]
fields: {}
module_constraints:
  lifecycle:
    enum: [draft, active, paused, retired]
required_sections: [Current Truth, Definition, Scope and Boundaries, Target Customer, Problems and Desired Outcomes, Qualification, Relationships, Sources, Timeline]
section_order: [Current Truth, Definition, Scope and Boundaries, Target Customer, Problems and Desired Outcomes, Qualification, Relationships, Sources, Timeline]
template: system/templates/business/customer-profile.md
admission:
  positive_fixture: system/data-model/tests/fixtures/valid-customer-profile.fixture
  positive_logical_path: business/customer-profiles/example-customer.md
  negative_fixture: system/data-model/tests/fixtures/invalid-customer-profile.fixture
  negative_logical_path: business/customer-profiles/example-customer.md
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: system/data-model/legacy-mapping.md
