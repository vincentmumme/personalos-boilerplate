name: agent
page_shape: state-record
canonical_owner: system-agent-registry
allowed_roots: [system]
path_pattern: ^system/agents/[a-z0-9]+(?:-[a-z0-9]+)*\.md$
required_modules: [lifecycle, authority]
optional_modules: []
required_fields: [lifecycle, canonical_system_ref, authority_scope, agent_kind, agent_scope]
optional_fields: []
fields:
  agent_kind:
    datatype: enum
    enum: [general, orchestrator, specialist, adapter]
  agent_scope:
    datatype: enum
    enum: [personalos, domain, project, runtime]
module_constraints:
  lifecycle:
    enum: [planned, active, paused, retired]
required_sections: [Current Truth, Purpose, Scope and Responsibilities, Persona and Behavior, Runtime and Hosts, Access and Boundaries, Sources, Timeline]
section_order: [Current Truth, Purpose, Scope and Responsibilities, Persona and Behavior, Runtime and Hosts, Access and Boundaries, Sources, Timeline]
template: system/templates/topology/agent.md
admission:
  positive_fixture: system/data-model/tests/fixtures/valid-agent.fixture
  positive_logical_path: system/agents/example-agent.md
  negative_fixture: system/data-model/tests/fixtures/invalid-agent.fixture
  negative_logical_path: system/agents/example-agent.md
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: system/data-model/legacy-mapping.md
