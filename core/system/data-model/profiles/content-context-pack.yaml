name: "content-context-pack"
page_shape: "state-record"
canonical_owner: "contentos-context-pack"
allowed_roots: ["content"]
path_pattern: "^content/pieces/[0-9]{4}/[a-z0-9]+(?:-[a-z0-9]+)*/context\\.md$"
required_modules: ["content-core", "lifecycle"]
optional_modules: []
required_fields: ["lifecycle", "revision", "piece_ref"]
optional_fields: ["origin_operation_id", "content_tags", "brand_revision", "strategy_revision", "channel_revisions", "recipe_revisions", "ckb_revisions"]
fields:
  brand_revision:
    datatype: "plain-text"
  strategy_revision:
    datatype: "plain-text"
  channel_revisions:
    datatype: "plain-text-list"
    min_items: 1
  recipe_revisions:
    datatype: "plain-text-list"
    min_items: 1
  ckb_revisions:
    datatype: "plain-text-list"
    min_items: 1
module_constraints:
  lifecycle:
    enum: ["draft", "locked", "superseded"]
required_sections: ["Current Truth", "Details", "Timeline"]
section_order: ["Current Truth", "Details", "Timeline"]
template: "system/templates/content/content-context-pack.md"
admission:
  positive_fixture: "system/data-model/tests/fixtures/valid-content-context-pack.fixture"
  positive_logical_path: "content/pieces/2026/example-piece/context.md"
  negative_fixture: "system/data-model/tests/fixtures/invalid-content-context-pack.fixture"
  negative_logical_path: "content/pieces/2026/example-piece/context.md"
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: "system/data-model/legacy-mapping.md"
