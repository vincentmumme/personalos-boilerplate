name: automation
page_shape: state-record
canonical_owner: automation-registry-record
allowed_roots: [automations]
path_pattern: ^automations/(?P<automation>[a-z0-9]+(?:-[a-z0-9]+)*)/(?P=automation)\.md$
required_modules: [lifecycle, signal-processing]
optional_modules: []
required_fields: [lifecycle, automation_kind]
optional_fields: [producer_skill_ref, schedule_timezone]
fields:
  automation_kind:
    datatype: enum
    enum: [scheduled, manual, event-driven, webhook, hybrid]
  schedule_timezone:
    datatype: plain-text
    iana_timezone: true
module_constraints:
  lifecycle:
    enum: [planned, active, paused, retired]
conditional_rules:
  scheduled_timezone:
    when_field: automation_kind
    when_in: [scheduled]
    require_fields: [schedule_timezone]
required_sections: [Current Truth, Purpose, Trigger and Cadence, Capability and Runtime, Inputs and Outputs, Credentials Required, Health and Freshness, Timeline]
section_order: [Current Truth, Purpose, Trigger and Cadence, Capability and Runtime, Inputs and Outputs, Credentials Required, Health and Freshness, Timeline]
template: system/templates/automations/automation.md
admission:
  positive_fixture: system/data-model/tests/fixtures/valid-automation.fixture
  positive_logical_path: automations/example-automation/example-automation.md
  negative_fixture: system/data-model/tests/fixtures/invalid-automation.fixture
  negative_logical_path: automations/example-automation/automation.md
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: system/data-model/legacy-mapping.md
