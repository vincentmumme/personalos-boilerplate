name: host
page_shape: state-record
canonical_owner: system-host-registry
allowed_roots: [system]
path_pattern: ^system/hosts/[a-z0-9]+(?:-[a-z0-9]+)*\.md$
required_modules: [lifecycle, authority]
optional_modules: []
required_fields: [lifecycle, canonical_system_ref, authority_scope, host_kind]
optional_fields: []
fields:
  host_kind:
    datatype: enum
    enum: [laptop, desktop, server, vps, cloud-runtime]
module_constraints:
  lifecycle:
    enum: [planned, active, offline, retired]
required_sections: [Current Truth, Purpose, Operating System, Runtimes and Services, Access, Health, Timeline]
section_order: [Current Truth, Purpose, Operating System, Runtimes and Services, Access, Health, Timeline]
template: system/templates/topology/host.md
admission:
  positive_fixture: system/data-model/tests/fixtures/valid-host.fixture
  positive_logical_path: system/hosts/example-host.md
  negative_fixture: system/data-model/tests/fixtures/invalid-host.fixture
  negative_logical_path: system/hosts/example-host.md
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: system/data-model/legacy-mapping.md
