name: journal-entry
page_shape: event-record
canonical_owner: daily-journal-entry
allowed_roots: [daily]
path_pattern: ^daily/[0-9]{4}/[0-9]{4}-[0-9]{2}-[0-9]{2}/journal/[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.md$
path_date_field: day_date
path_date_prefix_template: daily/{year}/{date}/journal/
parent_record:
  when_path_pattern: ^daily/(?P<year>[0-9]{4})/(?P<date>[0-9]{4}-[0-9]{2}-[0-9]{2})/journal/[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.md$
  required_path_template: daily/{year}/{date}/{date}.md
  required_profile: day-record
  skip_when_relations_disabled: true
required_modules: [daily-context, relations]
optional_modules: []
required_fields: [day_date, timezone, occurred_at, recorded_at, producer_kind, producer_name, journal_kind]
optional_fields: [runtime_name, producer_ref, journal_author_ref, evidence_refs]
fields:
  journal_kind:
    datatype: enum
    enum: [diary, reflection, thought, conversation, note]
  journal_author_ref:
    datatype: wikilink
    legacy_targets: warn
required_sections: [Journal Entry, Context, Sources, Corrections]
section_order: [Journal Entry, Context, Sources, Corrections]
template: system/templates/daily/journal-entry.md
admission:
  positive_fixture: system/data-model/tests/fixtures/valid-journal-entry.fixture
  positive_logical_path: daily/2026/2026-08-11/journal/019ff260-fb59-751d-8446-ae6735493846.md
  negative_fixture: system/data-model/tests/fixtures/invalid-journal-entry.fixture
  negative_logical_path: daily/2026/2026-08-11/journal/019ff260-fb80-7464-9fa8-eaf74b790a43.md
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: system/data-model/legacy-mapping.md
