name: finance-recurring-obligation
page_shape: state-record
canonical_owner: finance-recurring-obligation
allowed_roots: [finance]
path_pattern: ^finance/recurring/[a-z0-9]+(?:-[a-z0-9]+)*\.md$
required_modules: [finance-context, relations]
optional_modules: []
required_fields: [obligation_state, finance_scope, cadence]
optional_fields: [next_due_on, due_day, last_booked_period, payment_source_registry_ref, company_ref, project_ref, amount_gross, source_amount, currency, tax_rate, evidence_refs]
fields:
  obligation_state:
    datatype: enum
    enum: [active, paused, cancelled, ended]
  cadence:
    datatype: enum
    enum: [monthly, quarterly, yearly, irregular]
  next_due_on:
    datatype: date
  due_day:
    datatype: plain-text
    pattern: ^(?:[1-9]|[12][0-9]|3[01])$
  last_booked_period:
    datatype: plain-text
    pattern: ^[0-9]{4}-[0-9]{2}$
required_sections: [Current Truth, Obligation, Cadence and Due State, Cost and Allocation, Payment Source, External Authority, Evidence, Timeline]
section_order: [Current Truth, Obligation, Cadence and Due State, Cost and Allocation, Payment Source, External Authority, Evidence, Timeline]
template: system/templates/finance/finance-recurring-obligation.md
admission:
  positive_fixture: system/data-model/tests/fixtures/valid-finance-recurring-obligation.fixture
  positive_logical_path: finance/recurring/example-subscription.md
  negative_fixture: system/data-model/tests/fixtures/invalid-finance-recurring-obligation.fixture
  negative_logical_path: finance/belege/example-subscription.md
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: system/data-model/legacy-mapping.md
