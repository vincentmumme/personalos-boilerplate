name: context-gap-review
page_shape: view-record
canonical_owner: daily-context-gap-assessment
allowed_roots: [daily]
path_pattern: ^daily/[0-9]{4}/[0-9]{4}-[0-9]{2}-[0-9]{2}/context-gaps/[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.md$
path_date_field: day_date
path_date_prefix_template: daily/{year}/{date}/context-gaps/
parent_record:
  when_path_pattern: ^daily/(?P<year>[0-9]{4})/(?P<date>[0-9]{4}-[0-9]{2}-[0-9]{2})/context-gaps/[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\.md$
  required_path_template: daily/{year}/{date}/{date}.md
  required_profile: day-record
  skip_when_relations_disabled: true
required_modules: [daily-context, signal-processing, relations]
optional_modules: []
required_fields: [day_date, timezone, generated_at, context_gap_kind, producer_skill_ref]
optional_fields: [evidence_refs]
fields:
  context_gap_kind:
    datatype: enum
    enum: [question-batch, answer-ingest, feedback-review, deep-map]
required_sections: [Review, Gap Map, Questions and Answers, Routing and Propagation, Sources, Verification, Corrections]
section_order: [Review, Gap Map, Questions and Answers, Routing and Propagation, Sources, Verification, Corrections]
template: system/templates/daily/context-gap-review.md
admission:
  positive_fixture: system/data-model/tests/fixtures/valid-context-gap-review.fixture
  positive_logical_path: daily/2026/2026-08-14/context-gaps/01a0015e-8a7b-76bd-8dbb-cf7a300bfe6b.md
  negative_fixture: system/data-model/tests/fixtures/invalid-context-gap-review.fixture
  negative_logical_path: daily/2026/2026-08-14/context-gaps/question-batch.md
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: system/data-model/legacy-mapping.md
