name: health-daily-assessment
page_shape: state-record
canonical_owner: health-daily-assessment
allowed_roots: [health]
path_pattern: ^health/daily/[0-9]{4}/(?P<date>[0-9]{4}-[0-9]{2}-[0-9]{2})-health\.md$
path_date_field: assessment_date
path_date_group: date
required_modules: [subject-context]
optional_modules: []
required_fields: [assessment_date, readiness_band, training_recommendation, provider_snapshot_ref, subject_ref]
optional_fields: []
fields:
  assessment_date:
    datatype: date
  readiness_band:
    datatype: enum
    enum: [green, yellow, red, unknown]
  training_recommendation:
    datatype: enum
    enum: [train, light, rest, unknown]
  provider_snapshot_ref:
    datatype: wikilink
    target_profiles: [health-provider-snapshot]
    legacy_targets: reject
required_sections: [Current Truth, Readiness, Training Guidance, Evidence, Data Gaps, Timeline]
section_order: [Current Truth, Readiness, Training Guidance, Evidence, Data Gaps, Timeline]
template: system/templates/health/health-daily-assessment.md
admission:
  positive_fixture: system/data-model/tests/fixtures/valid-health-daily-assessment.fixture
  positive_logical_path: health/daily/2026/2026-08-14-health.md
  negative_fixture: system/data-model/tests/fixtures/invalid-health-daily-assessment.fixture
  negative_logical_path: health/whoop/2026/2026-08-14-health.md
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: system/data-model/legacy-mapping.md
