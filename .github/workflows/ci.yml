name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-platforms:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Audit public build
        run: pos-boilerplate audit --build . --public-safe-terms policy/public-safe-terms.json

      - name: Scan worktree and Git history for secrets
        run: pos-boilerplate secret-scan --repository . --history

  # Preserve the two existing required-check names. Both gates require the
  # complete platform matrix to pass, including cancellation/failure handling.
  verify:
    name: Python ${{ matrix.python-version }}
    needs: verify-platforms
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Require every supported platform
        shell: bash
        env:
          PLATFORM_RESULT: ${{ needs.verify-platforms.result }}
        run: test "$PLATFORM_RESULT" = success
