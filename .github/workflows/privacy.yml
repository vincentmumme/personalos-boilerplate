name: Protected privacy review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  protected-privacy-markers:
    name: Protected privacy markers
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install trusted scanner
        run: python -m pip install .

      - name: Fetch pull request as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"

      - name: Materialize protected markers outside the repository
        id: markers
        env:
          POS_PRIVATE_MARKERS_JSON: ${{ secrets.POS_PRIVATE_MARKERS_JSON }}
        run: |
          marker_dir="$(mktemp -d)"
          chmod 700 "$marker_dir"
          marker_file="$marker_dir/private-markers.json"
          python - "$marker_file" <<'PY'
          import json
          import os
          import sys
          import unicodedata
          from pathlib import Path

          raw = os.environ.get("POS_PRIVATE_MARKERS_JSON", "")
          markers = json.loads(raw) if raw else None
          if not isinstance(markers, list) or not markers or not all(
              isinstance(item, str) and item.strip() for item in markers
          ):
              raise SystemExit("POS_PRIVATE_MARKERS_JSON is missing or invalid")
          safe_terms = json.loads(Path("policy/public-safe-terms.json").read_text())
          normalize = lambda value: unicodedata.normalize("NFKC", value.strip()).casefold()
          effective = {
              normalize(item) for item in markers
          } - {
              normalize(item) for item in safe_terms if item.strip()
          }
          if not effective:
              raise SystemExit("POS_PRIVATE_MARKERS_JSON has no effective rules")
          Path(sys.argv[1]).write_text(json.dumps(markers), encoding="utf-8")
          PY
          chmod 600 "$marker_file"
          echo "marker_file=$marker_file" >> "$GITHUB_OUTPUT"

      - name: Scan pull request objects with trusted code
        run: |
          pos-boilerplate secret-scan \
            --repository . \
            --history \
            --private-markers "${{ steps.markers.outputs.marker_file }}" \
            --public-safe-terms policy/public-safe-terms.json
