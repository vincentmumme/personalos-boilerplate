name: "content-format"
page_shape: "state-record"
canonical_owner: "contentos-format"
allowed_roots: ["content"]
path_pattern: "^content/formats/(?:[a-z0-9]+(?:-[a-z0-9]+)*/)*[a-z0-9]+(?:-[a-z0-9]+)*\\.md$"
required_modules: ["content-core", "lifecycle"]
optional_modules: []
required_fields: ["lifecycle", "revision", "format_family", "definition"]
optional_fields: ["origin_operation_id", "content_tags", "default_channel_keys", "quality_profile_refs"]
fields:
  format_family:
    datatype: "lower-kebab"
  definition:
    datatype: "plain-text"
  default_channel_keys:
    datatype: "plain-text-list"
    min_items: 1
module_constraints:
  lifecycle:
    enum: ["draft", "active", "deprecated", "archived"]
required_sections: ["Current Truth", "Details", "Timeline"]
section_order: ["Current Truth", "Details", "Timeline"]
template: "system/templates/content/content-format.md"
admission:
  positive_fixture: "system/data-model/tests/fixtures/valid-content-format.fixture"
  positive_logical_path: "content/formats/example-format.md"
  negative_fixture: "system/data-model/tests/fixtures/invalid-content-format.fixture"
  negative_logical_path: "content/formats/example-format.md"
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: "system/data-model/legacy-mapping.md"
