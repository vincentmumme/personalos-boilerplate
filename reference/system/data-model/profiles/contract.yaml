name: contract
page_shape: normative-record
canonical_owner: system-contracts
allowed_roots: [system]
path_pattern: ^system/contracts/(?:[a-z0-9]+(?:-[a-z0-9]+)*/)*[a-z0-9]+(?:-[a-z0-9]+)*\.md$
required_modules: [lifecycle, normative-lineage]
optional_modules: []
required_fields: [lifecycle, decision_refs, contract_version]
optional_fields: [derived_from_refs, supersedes_refs]
fields:
  contract_version:
    datatype: semver
module_constraints:
  lifecycle:
    enum: [active, deprecated, retired]
required_sections: [Contract, Scope, Invariants, Interfaces, Compliance, Evolution, Change History]
section_order: [Contract, Scope, Invariants, Interfaces, Compliance, Evolution, Change History]
template: system/templates/contract.md
admission:
  positive_fixture: system/data-model/tests/fixtures/valid-contract.fixture
  positive_logical_path: system/contracts/example-contract.md
  negative_fixture: system/data-model/tests/fixtures/invalid-contract.fixture
  negative_logical_path: system/contracts/example-contract.md
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: system/data-model/legacy-mapping.md
