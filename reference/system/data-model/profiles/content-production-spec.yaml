name: "content-production-spec"
page_shape: "state-record"
canonical_owner: "contentos-production-spec"
allowed_roots: ["content"]
path_pattern: "^content/pieces/[0-9]{4}/[a-z0-9]+(?:-[a-z0-9]+)*/production\\.md$"
required_modules: ["content-core", "lifecycle"]
optional_modules: []
required_fields: ["lifecycle", "revision", "piece_ref"]
optional_fields: ["origin_operation_id", "content_tags"]
fields:

module_constraints:
  lifecycle:
    enum: ["draft", "approved", "superseded"]
required_sections: ["Current Truth", "Details", "Timeline"]
section_order: ["Current Truth", "Details", "Timeline"]
template: "system/templates/content/content-production-spec.md"
admission:
  positive_fixture: "system/data-model/tests/fixtures/valid-content-production-spec.fixture"
  positive_logical_path: "content/pieces/2026/example-piece/production.md"
  negative_fixture: "system/data-model/tests/fixtures/invalid-content-production-spec.fixture"
  negative_logical_path: "content/pieces/2026/example-piece/production.md"
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: "system/data-model/legacy-mapping.md"
