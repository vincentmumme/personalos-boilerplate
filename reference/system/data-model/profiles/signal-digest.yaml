name: signal-digest
page_shape: work-artifact
canonical_owner: interaction-signal-digest
allowed_roots: [interactions]
path_pattern: ^interactions/signals/[a-z0-9]+(?:-[a-z0-9]+)*/[0-9]{4}/(?P<date>[0-9]{4}-[0-9]{2}-[0-9]{2})\.md$
path_date_field: digest_date
path_date_group: date
required_modules: [relations, signal-processing]
optional_modules: []
required_fields: [digest_date, digest_kind, digest_outcome, coverage_started_at, coverage_ended_at, producer_skill_ref]
optional_fields: [source_system, source_channel, evidence_refs, affected_owner_refs]
fields:
  digest_date:
    datatype: date
  digest_kind:
    datatype: enum
    enum: [news, creator-x, creator-youtube, weekly-synthesis]
  digest_outcome:
    datatype: enum
    enum: [success, partial, failed, stale, empty]
required_sections: [Digest Summary, Coverage, Signals, Source Map, Propagation, Gaps and Corrections]
section_order: [Digest Summary, Coverage, Signals, Source Map, Propagation, Gaps and Corrections]
template: system/templates/interactions/signal-digest.md
admission:
  positive_fixture: system/data-model/tests/fixtures/valid-signal-digest.fixture
  positive_logical_path: interactions/signals/nightly-news/2026/2026-08-14.md
  negative_fixture: system/data-model/tests/fixtures/invalid-signal-digest.fixture
  negative_logical_path: automations/nightly-news/outputs/2026-08-14.md
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: system/data-model/legacy-mapping.md
