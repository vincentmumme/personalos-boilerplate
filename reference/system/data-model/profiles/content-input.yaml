name: "content-input"
page_shape: "event-record"
canonical_owner: "contentos-input"
allowed_roots: ["content"]
path_pattern: "^content/inputs/(?:[a-z0-9]+(?:-[a-z0-9]+)*/)*[a-z0-9]+(?:-[a-z0-9]+)*\\.md$"
required_modules: ["content-core"]
optional_modules: []
required_fields: ["revision", "content_captured_at", "routing_decision"]
optional_fields: ["origin_operation_id", "content_tags", "result_refs"]
fields:
  content_captured_at:
    datatype: "datetime"
  routing_decision:
    datatype: "plain-text"
required_sections: ["Summary", "Evidence", "Corrections"]
section_order: ["Summary", "Evidence", "Corrections"]
template: "system/templates/content/content-input.md"
admission:
  positive_fixture: "system/data-model/tests/fixtures/valid-content-input.fixture"
  positive_logical_path: "content/inputs/example-input.md"
  negative_fixture: "system/data-model/tests/fixtures/invalid-content-input.fixture"
  negative_logical_path: "content/inputs/example-input.md"
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: "system/data-model/legacy-mapping.md"
