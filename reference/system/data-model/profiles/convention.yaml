name: convention
page_shape: normative-record
canonical_owner: system-conventions
allowed_roots: [system]
path_pattern: ^system/conventions/(?:[a-z0-9]+(?:-[a-z0-9]+)*/)*[a-z0-9]+(?:-[a-z0-9]+)*\.md$
required_modules: [lifecycle, normative-lineage]
optional_modules: []
required_fields: [lifecycle, decision_refs]
optional_fields: [derived_from_refs, supersedes_refs]
fields: {}
module_constraints:
  lifecycle:
    enum: [active, deprecated, retired]
required_sections: [Convention, Use When, Default, Allowed Variations, Examples, Change History]
section_order: [Convention, Use When, Default, Allowed Variations, Examples, Change History]
template: system/templates/convention.md
admission:
  positive_fixture: system/data-model/tests/fixtures/valid-convention.fixture
  positive_logical_path: system/conventions/example-convention.md
  negative_fixture: system/data-model/tests/fixtures/invalid-convention.fixture
  negative_logical_path: system/conventions/example-convention.md
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: system/data-model/legacy-mapping.md
