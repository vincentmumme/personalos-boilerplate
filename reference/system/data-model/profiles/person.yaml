name: person
page_shape: state-record
canonical_owner: people-person-record
allowed_roots: [people]
path_pattern: ^people/[a-z0-9]+(?:-[a-z0-9]+)*\.md$
required_modules: [lifecycle, authority]
optional_modules: []
required_fields: [lifecycle, canonical_system_ref, authority_scope]
optional_fields: [primary_company_ref]
fields:
  primary_company_ref:
    datatype: wikilink
    target_profiles: [company]
    legacy_targets: warn
module_constraints:
  lifecycle:
    enum: [active, inactive, deceased]
required_sections: [Current Truth, Identity and Roles, Relationship to Subject, Communication Profile, Relevant Context, Affiliations and Relationships, Sources, Timeline]
section_order: [Current Truth, Identity and Roles, Relationship to Subject, Communication Profile, Relevant Context, Affiliations and Relationships, Sources, Timeline]
template: system/templates/entities/person.md
admission:
  positive_fixture: system/data-model/tests/fixtures/valid-person.fixture
  positive_logical_path: people/example-person.md
  negative_fixture: system/data-model/tests/fixtures/invalid-person.fixture
  negative_logical_path: people/example-person.md
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: system/data-model/legacy-mapping.md
