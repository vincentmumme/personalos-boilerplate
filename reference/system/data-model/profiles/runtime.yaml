name: runtime
page_shape: state-record
canonical_owner: system-runtime-registry
allowed_roots: [system]
path_pattern: ^system/runtimes/[a-z0-9]+(?:-[a-z0-9]+)*\.md$
required_modules: [lifecycle, authority]
optional_modules: []
required_fields: [lifecycle, canonical_system_ref, authority_scope, runtime_kind, agent_refs, host_refs]
optional_fields: []
fields:
  runtime_kind:
    datatype: enum
    enum: [cli, daemon, desktop-app, server, orchestration-framework]
  agent_refs:
    datatype: wikilink-list
    min_items: 1
    target_profiles: [agent]
    legacy_targets: reject
  host_refs:
    datatype: wikilink-list
    min_items: 1
    target_profiles: [host]
    legacy_targets: reject
module_constraints:
  lifecycle:
    enum: [planned, active, paused, retired]
required_sections: [Current Truth, Purpose, Agents, Hosts and Execution, Configuration, Credentials Required, Health, Timeline]
section_order: [Current Truth, Purpose, Agents, Hosts and Execution, Configuration, Credentials Required, Health, Timeline]
template: system/templates/topology/runtime.md
admission:
  positive_fixture: system/data-model/tests/fixtures/valid-runtime.fixture
  positive_logical_path: system/runtimes/example-runtime.md
  negative_fixture: system/data-model/tests/fixtures/invalid-runtime.fixture
  negative_logical_path: system/runtimes/example-runtime.md
  validator_test: system/data-model/tests/test_registry_contract.py
  migration_mapping: system/data-model/legacy-mapping.md
